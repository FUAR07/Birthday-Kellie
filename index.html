<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Birthday</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      color: #ffffff;
      text-align: center;
    }

    .card {
      padding: 2rem;
      border-radius: 1rem;
      background: rgba(0, 0, 0, 0.25);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 2.5rem;
    }

    p {
      margin: 0;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>🎉 Happy Birthday, Kellie! 🎂</h1>
    <p>Wishing you a day filled with joy, laughter, and love.</p>
  </main>
</body>
</html>
